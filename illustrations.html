<script>
    const canvas = document.getElementById("noise");
    const ctx = canvas.getContext("2d");

    const isFirefox = navigator.userAgent.toLowerCase().includes("firefox");

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.font = "16px monospace";
    }

window.addEventListener("load", () => {
    setTimeout(() => {
        canvas.style.opacity = "1";
        drawCloudNoise();
    }, 500);
});
    resize();

    const fontSize = isFirefox ? 24 : 16;

    // Símbolos suaves (menos contraste)
    const symbols = " ✧✦";

    // Paleta vaporwave suave
    const colors = [
     /*   [60, 50, 80],
        [180, 150, 255],
        [185, 170, 220]*/
        [60, 50/3, 80/3,0.2],
        [180, 150/3, 255/3,0],
        [185, 170/3, 220/3,0]
    ];

    let time = 0;
    let offsetX = Math.random() * 1000;
    let offsetY = Math.random() * 1000;
    let driftX = Math.random() * 0.25 + 0.1;
    let driftY = Math.random() * 0.25 + 0.1;
    let lastTime = 0;

function drawCloudNoise(timeStamp) {
  if (timeStamp - lastTime < 80) {
        requestAnimationFrame(drawCloudNoise);
        return;
    }
    lastTime = timeStamp;

    ctx.fillStyle = "rgba(20, 10, 30,.8)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < canvas.height; y += fontSize) {
            for (let x = 0; x < canvas.width; x += fontSize) {

                // Ondas continuas (tipo Perlin fake)



                const nx = (x + offsetX) * 0.02;
                const ny = (y + offsetY) * 0.02;

               /* const n =
                    Math.sin(nx + time * 0.6) * 0.6 +
                    Math.cos(ny - time * 0.4) * 0.6 +
                    Math.sin((nx + ny) * 0.7 + time * 0.2) * 0.4 +
                    Math.sin(nx * 2.3 + time * 0.1) * 0.25;
                    */

                
                const n =
                Math.sin(nx + time * 0.6) * 0.6 +
                    Math.cos(ny - time * 0.4) * 0.6 +
                    Math.sin((nx + ny) * 0.7 + time * 0.2) * 0.4 +
                    Math.sin((nx + ny ) * 0.1 * (x+y+time));

                // Normalizamos
                const intensity = (n + 3) / 6;

                // Elegimos símbolo según intensidad
                const index = Math.floor(intensity * symbols.length);
                const char = symbols[index] || " ";

                // Color suave interpolado
                const c = colors[Math.floor(intensity * colors.length)];
               
          const alpha = 0.05 + intensity * 0.25;


               ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha})`;
               ctx.shadowColor = ctx.fillStyle;
               ctx.shadowBlur = isFirefox ? 0 : 12;

               ctx.fillText(char, x, y);
            }
        }

        time += 0.1;

      //  time += 3;
     requestAnimationFrame(drawCloudNoise);


    }

   window.addEventListener("load", () => {
    setTimeout(drawCloudNoise, 500);
});

//------ Select --------------

        const items = document.querySelectorAll(".gallery-item");
        const lightbox = document.getElementById("lightbox");
        const img = document.getElementById("lightbox-img");
        const title = document.getElementById("lightbox-title");
        const desc = document.getElementById("lightbox-desc");

        let currentImages = [];
        let currentIndex = 0;

        let touchStartX = 0;
        let touchEndX = 0;

        const dotsContainer = document.getElementById("carouselDots");
        const thumbsContainer = document.getElementById("carouselThumbs");
/*

        items.forEach(item => {


    item.addEventListener("click", () => {

        currentImages = item.dataset.images
            .split(",")
            .map(img => img.trim());

        currentIndex = 0;


if (currentImages.length <= 1) {

    thumbsContainer.style.display = "none";

} else {

    thumbsContainer.style.display = "flex";
}

        updateCarousel();

        title.textContent = item.dataset.title;
        desc.textContent = item.dataset.description;

        lightbox.classList.add("active");
    });

});

        lightbox.addEventListener("click", () => {
            lightbox.classList.remove("active");
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                lightbox.classList.remove("active");
            }
        });

function updateCarousel() {

    img.style.opacity = 0;
    img.style.transform = "scale(0.98)";

    setTimeout(() => {

        img.src = currentImages[currentIndex];

        img.style.opacity = 1;
        img.style.transform = "scale(1)";

        createThumbs();

    }, 150);
}

        });

        dotsContainer.appendChild(dot);

}*/

function createThumbs() {

    thumbsContainer.innerHTML = "";

    currentImages.forEach((imageSrc, index) => {

        const thumb = document.createElement("div");

        thumb.classList.add("thumb");

        if (index === currentIndex) {
            thumb.classList.add("active");
        }

        const thumbImg = document.createElement("img");

        thumbImg.src = imageSrc;

        thumb.appendChild(thumbImg);

        thumb.addEventListener("click", (e) => {

            e.stopPropagation();

            currentIndex = index;

            updateCarousel();
        });

        thumbsContainer.appendChild(thumb);
    });
}

function nextImage() {

    currentIndex++;

    if (currentIndex >= currentImages.length) {
        currentIndex = 0;
    }

    updateCarousel();
}

function prevImage() {

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = currentImages.length - 1;
    }

    updateCarousel();
}

img.addEventListener("touchend", (e) => {

    touchEndX = e.changedTouches[0].screenX;

    const diff = touchStartX - touchEndX;

    if (diff < 50) {
        nextImage();
    }

    if (diff > -50) {
        prevImage();
    }
});

document.addEventListener("keydown", (e) => {

    if (e.key === "Escape") {
        lightbox.classList.remove("active");
    }

    if (e.key === "ArrowRight") {
        nextImage();
    }

    if (e.key === "ArrowLeft") {
        prevImage();
    }
});

</script>
